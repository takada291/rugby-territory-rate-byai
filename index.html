<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テリトリー率AI判定</title>
  
  <!-- GA4 Tracking Code -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8PJYQKC5F5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8PJYQKC5F5');
  </script>

  <!-- Chart.js for グラフ描画 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
  </script>

  <style>
    body { font-family: sans-serif; background-color: #f5f7fa; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; color: #1976d2; font-size: 1.5rem; border-bottom: 2px solid #e3f2fd; padding-bottom: 10px; }
    
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
    input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 0.9rem; resize: vertical; height: 120px; }
    
    .btn { background: #1976d2; color: white; border: none; padding: 12px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn:hover { background: #1565c0; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    
    .dashboard { display: flex; flex-direction: column; gap: 20px; }
    .status-container { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    
    .chart-container { width: 100%; margin: 0 auto; display: none; height: 150px; }
    
    #progress-text { font-size: 1.2rem; font-weight: bold; color: #d32f2f; margin-bottom: 10px; }
    
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
    
    .thumb-card { position: relative; border: 2px solid #ddd; border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; display: flex; flex-direction: column; }
    .thumb-card img { width: 100%; aspect-ratio: 16/9; object-fit: contain; display: block; opacity: 0.5; transition: opacity 0.3s; flex: 1; }
    .thumb-card.done img { opacity: 1; }
    .thumb-card:hover { border-color: #1976d2; }
    
    .label-badge { position: absolute; top: 10px; left: 10px; padding: 5px 10px; font-weight: bold; color: white; border-radius: 4px; font-size: 0.9rem; z-index: 10; display: none; user-select: none; }
    .label-left { background-color: #ff9800; }
    .label-right { background-color: #d32f2f; }
    .label-center { background-color: #1976d2; }
    .label-error { background-color: #616161; }
    
    .index-badge { position: absolute; top: 10px; right: 10px; padding: 3px 8px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.7); border-radius: 4px; font-size: 0.85rem; z-index: 10; user-select: none; }
    .model-badge { padding: 6px; font-weight: bold; color: #ccc; background: #222; font-size: 0.75rem; text-align: center; display: none; user-select: none; word-break: break-all; }
  </style>
</head>
<body>

<div class="container">
  <div class="panel">
    <h1>🤖 テリトリー率AI判定 v1.5</h1>
    
    <div class="input-group">
      <label>Google Gemini APIキー</label>
      <input type="password" id="api-key" placeholder="APIキーを入力（ブラウザに保存されます）">
    </div>

    <div class="input-group">
      <label>AIへの指示文（プロンプト） ※自由に書き換えて精度を調整できます</label>
      <textarea id="prompt-text">
あなたはこのラグビーの試合画像の分析者です。
画像で左側に人が多い場合は『左側』、右側に人が多い場合は『右側』、どちらともいえないなら『中央』と判定してください。

出力は必ず以下のJSONフォーマットのみにしてください。他の文章は一切不要です。
{"direction": "Left"} （左側に人が多い場合）
{"direction": "Right"} （右側に人が多い場合）
{"direction": "Center"} （どちらともいえない場合）</textarea>
    </div>

    <div class="input-group">
      <label>分析する画像（ビデオクリップから抽出した画像など）を選択</label>
      <input type="file" id="image-upload" accept="image/*" multiple>
    </div>
    
    <button id="btn-run" class="btn">🚀 AI判定スタート</button>
  </div>

  <div class="panel dashboard" id="dashboard-area">
    <div class="status-container">
      <div id="progress-text">準備完了（画像を選択してください）</div>
      <div id="result-stats" style="font-size: 1.1rem; line-height: 1.8; display: none;"></div>
    </div>
    <div class="chart-container" id="chart-wrapper">
      <canvas id="territoryChart"></canvas>
    </div>
  </div>

  <div class="panel">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>判定結果ギャラリー</h3>
      <span style="font-size: 0.9rem; color: #666;">※画像をクリックすると判定を「左→中央→右→エラー」の順で手動修正できます。</span>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>
</div>

<script type="module">
  import { GoogleGenerativeAI } from "@google/generative-ai";

  const apiKeyInput = document.getElementById('api-key');
  const promptInput = document.getElementById('prompt-text');
  const imageInput = document.getElementById('image-upload');
  const btnRun = document.getElementById('btn-run');
  const gallery = document.getElementById('gallery');
  const progressText = document.getElementById('progress-text');
  const chartWrapper = document.getElementById('chart-wrapper');
  const resultStats = document.getElementById('result-stats');
  
  let chartInstance = null;
  let fileData = [];

  const MODEL_CANDIDATES = ["gemini-3.8-flash", "gemini-3.6-flash"];

  const savedKey = localStorage.getItem('gemini_api_key_rugby');
  if(savedKey) apiKeyInput.value = savedKey;

  function extractTimeFromFilename(filename) {
    const match = filename.match(/(\d+)m(\d+)s/);
    if (match) {
      return parseInt(match[1]) * 60 + parseInt(match[2]);
    }
    return null;
  }

  function formatTimeDisplay(seconds) {
    if (seconds === null) return '';
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  imageInput.addEventListener('change', async (e) => {
    gallery.innerHTML = '';
    fileData = [];
    
    const files = Array.from(e.target.files).sort((a, b) => {
      const timeA = extractTimeFromFilename(a.name) || 0;
      const timeB = extractTimeFromFilename(b.name) || 0;
      return timeA - timeB;
    });

    // プレースホルダーとしてギャラリーに空の枠を順番通りに作成しておく
    files.forEach((file, index) => {
      const card = document.createElement('div');
      card.className = 'thumb-card';
      card.id = `card-${index}`;
      card.onclick = () => toggleManualState(index);
      gallery.appendChild(card);
    });

    // 各画像を非同期で読み込み、作成しておいた枠の中身を書き換える
    const loadPromises = files.map((file, index) => {
      return new Promise((resolve) => {
        const timeSec = extractTimeFromFilename(file.name);
        
        fileData.push({
          file: file,
          filename: file.name,
          timeSec: timeSec,
          timeDisplay: formatTimeDisplay(timeSec),
          state: 'Waiting',
          usedModel: '待機中'
        });
        
        const reader = new FileReader();
        reader.onload = (event) => {
          const card = document.getElementById(`card-${index}`);
          card.innerHTML = `
            <div class="index-badge">画像${index + 1}</div>
            <div class="label-badge" id="badge-${index}">待機中</div>
            <img src="${event.target.result}" id="img-${index}">
            <div class="model-badge" id="model-${index}">
               ${timeSec !== null ? `⏱️ ${formatTimeDisplay(timeSec)}` : '待機中'}
            </div>
          `;
          resolve();
        };
        reader.readAsDataURL(file);
      });
    });
    
    await Promise.all(loadPromises);
    
    // fileDataをインデックス順にソートし直す（非同期読み込み順によるズレを防ぐため）
    fileData.sort((a, b) => files.indexOf(a.file) - files.indexOf(b.file));
    
    progressText.textContent = `${files.length}枚の画像が選択されました。`;
    chartWrapper.style.display = 'none';
    resultStats.style.display = 'none';
  });

  async function fileToGenerativePart(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        resolve({
          inlineData: { data: reader.result.split(',')[1], mimeType: file.type }
        });
      };
      reader.readAsDataURL(file);
    });
  }

  function toggleManualState(index) {
    const currentState = fileData[index].state;
    if (currentState === 'Waiting') return; 
    
    const states = ['Left', 'Center', 'Right', 'Error'];
    let currentIndex = states.indexOf(currentState);
    let nextIndex = (currentIndex + 1) % states.length;
    let nextState = states[nextIndex];
    
    updateBadgeUI(index, nextState);
    recalculateStats();
    
    const modelBadge = document.getElementById(`model-${index}`);
    if (modelBadge) {
      const timeStr = fileData[index].timeDisplay;
      modelBadge.innerHTML = `${timeStr ? `⏱️ ${timeStr}<br>` : ''}<span style="color:#fff;">手動修正</span>`;
    }
  }

  function updateBadgeUI(index, state) {
    fileData[index].state = state;
    const badge = document.getElementById(`badge-${index}`);
    if (!badge) return;

    badge.style.display = 'block';
    if (state === 'Left') {
      badge.textContent = '◀ 左陣地';
      badge.className = 'label-badge label-left';
    } else if (state === 'Right') {
      badge.textContent = '右陣地 ▶';
      badge.className = 'label-badge label-right';
    } else if (state === 'Center') {
      badge.textContent = '・ 中 央';
      badge.className = 'label-badge label-center';
    } else {
      badge.textContent = '判定エラー';
      badge.className = 'label-badge label-error';
    }
  }

  function recalculateStats() {
    let counts = { Left: 0, Right: 0, Center: 0, Error: 0 };
    fileData.forEach(item => {
      if (counts[item.state] !== undefined) counts[item.state]++;
    });
    drawChart(counts);
  }

  btnRun.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    const customPrompt = promptInput.value.trim();
    
    if(!apiKey) { alert('APIキーを入力してください'); return; }
    if(!customPrompt) { alert('プロンプトを入力してください'); return; }
    if(fileData.length === 0) { alert('画像を選択してください'); return; }
    
    localStorage.setItem('gemini_api_key_rugby', apiKey);
    btnRun.disabled = true;
    
    let processed = 0;
    progressText.textContent = `判定中... (0 / ${fileData.length})`;

    const genAI = new GoogleGenerativeAI(apiKey);

    const chunkArray = (arr, size) => Array.from({ length: Math.ceil(arr.length / size) }, (v, i) => arr.slice(i * size, i * size + size));
    const fileChunks = chunkArray(fileData, 3);

    for (let chunkIndex = 0; chunkIndex < fileChunks.length; chunkIndex++) {
      const chunk = fileChunks[chunkIndex];
      
      const promises = chunk.map(async (dataObj, i) => {
        const globalIndex = chunkIndex * 3 + i;
        const badge = document.getElementById(`badge-${globalIndex}`);
        const modelBadge = document.getElementById(`model-${globalIndex}`);
        const card = document.getElementById(`card-${globalIndex}`);
        
        badge.style.display = 'block';
        badge.textContent = '思考中...';
        badge.style.backgroundColor = '#424242';

        const imagePart = await fileToGenerativePart(dataObj.file);
        let successState = 'Error';
        let usedModel = 'API Error';

        for (const modelName of MODEL_CANDIDATES) {
          try {
            const model = genAI.getGenerativeModel({ model: modelName });
            const result = await model.generateContent([customPrompt, imagePart]);
            const responseText = result.response.text();
            
            const jsonMatch = responseText.match(/\{[\s\S]*?\}/);
            if (!jsonMatch) throw new Error("JSONが見つかりません");

            const data = JSON.parse(jsonMatch[0]);
            if (['Left', 'Right', 'Center'].includes(data.direction)) {
              successState = data.direction;
              usedModel = modelName;
              break; 
            } else {
              throw new Error("フォーマット違反");
            }
          } catch (error) {
            console.warn(`[${modelName}] 画像 ${globalIndex} の処理に失敗しました:`, error);
            usedModel = `${modelName} Failed`;
          }
        }

        updateBadgeUI(globalIndex, successState);
        fileData[globalIndex].usedModel = usedModel;
        
        if (modelBadge) {
          const timeStr = dataObj.timeDisplay;
          const color = usedModel.includes('Failed') ? '#ff8a80' : '#ccc';
          modelBadge.innerHTML = `${timeStr ? `⏱️ ${timeStr}<br>` : ''}<span style="color:${color};">${usedModel}</span>`;
          modelBadge.style.display = 'block';
        }
        
        card.classList.add('done');
        processed++;
        progressText.textContent = `判定中... (${processed} / ${fileData.length})`;
      });

      await Promise.all(promises);
      
      if(chunkIndex < fileChunks.length - 1) {
        await new Promise(resolve => setTimeout(resolve, 3000));
      }
    }

    progressText.textContent = '🎉 全画像の判定が完了しました！（画像をクリックで修正可能）';
    btnRun.disabled = false;
    
    recalculateStats();
  });

  function drawChart(counts) {
    chartWrapper.style.display = 'block';
    resultStats.style.display = 'block';
    
    const totalValid = counts.Left + counts.Right; 
    const leftRate = totalValid > 0 ? Math.round((counts.Left / totalValid) * 100) : 0;
    const rightRate = totalValid > 0 ? Math.round((counts.Right / totalValid) * 100) : 0;
    
    resultStats.innerHTML = `
      <strong>全体判定内訳:</strong>
      <span style="color:#ff9800; margin-left: 10px;">◀ 左陣地: ${counts.Left}枚</span>
      <span style="color:#1976d2; margin-left: 10px;">・ 中 央: ${counts.Center}枚</span>
      <span style="color:#d32f2f; margin-left: 10px;">▶ 右陣地: ${counts.Right}枚</span>
      <br>
      <span style="font-weight:bold; font-size:1.2rem; margin-top:5px; display:inline-block;">総合テリトリー率 (左 vs 右): ${leftRate}% vs ${rightRate}%</span>
      ${counts.Error > 0 ? `<br><span style="color:#616161; font-size: 0.9rem;">※判定エラー: ${counts.Error}枚 (クリックで手動修正してください)</span>` : ''}
    `;

    if(chartInstance) chartInstance.destroy();
    
    const timeLabels = [];
    const dataLeft = [];
    const dataCenter = [];
    const dataRight = [];

    fileData.forEach((item, i) => {
       const state = item.state;
       const label = `画像${i + 1}`;
       timeLabels.push(label);
       
       dataLeft.push(state === 'Left' ? 1 : 0);
       dataCenter.push(state === 'Center' ? 1 : 0);
       dataRight.push(state === 'Right' ? 1 : 0);
    });

    const ctx = document.getElementById('territoryChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: timeLabels,
        datasets: [
          {
            label: '左陣地',
            data: dataLeft,
            backgroundColor: '#ff9800',
            barPercentage: 1.0,
            categoryPercentage: 1.0 
          },
          {
            label: '中央',
            data: dataCenter,
            backgroundColor: '#1976d2',
            barPercentage: 1.0,
            categoryPercentage: 1.0
          },
          {
            label: '右陣地',
            data: dataRight,
            backgroundColor: '#d32f2f',
            barPercentage: 1.0,
            categoryPercentage: 1.0
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom' },
          tooltip: {
            callbacks: {
              label: function(context) {
                return context.raw === 1 ? context.dataset.label : null;
              }
            }
          }
        },
        scales: {
          x: {
            stacked: true,
            title: { display: true, text: '試合経過' },
            grid: { display: false }
          },
          y: {
            stacked: true,
            display: false,
            max: 1
          }
        }
      }
    });
  }
</script>
</body>
</html>
